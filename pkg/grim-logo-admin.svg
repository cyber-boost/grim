<svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="handleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#654321"></stop>
            <stop offset="100%" style="stop-color:#8b4513"></stop>
        </linearGradient>
        <linearGradient id="bladeGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#b8860b"></stop>
            <stop offset="100%" style="stop-color:#8b4513"></stop>
        </linearGradient>
    </defs>
    
    <!-- Centered scythe -->
    <line x1="35" y1="75" x2="55" y2="25" stroke="url(#handleGrad3)" stroke-width="4" stroke-linecap="round"></line>
    <path d="M55 25 C67 18, 85 22, 93 35 C90 42, 80 45, 70 42 C63 38, 57 30, 55 25" fill="url(#bladeGrad3)" stroke="#654321" stroke-width="1"></path>
    
    <!-- Data streams -->
    <g>
        <rect x="70" y="45" width="25" height="3" fill="#b8860b" rx="1"></rect>
        <rect x="67" y="52" width="20" height="3" fill="#daa520" rx="1"></rect>
        <rect x="72" y="59" width="18" height="3" fill="#b8860b" rx="1"></rect>
        
        <!-- Cut pieces -->
        <g opacity="0.6">
            <rect x="96" y="45" width="6" height="3" fill="#b8860b" rx="1" transform="rotate(15 99 46.5)"></rect>
            <rect x="88" y="52" width="5" height="3" fill="#daa520" rx="1" transform="rotate(20 90.5 53.5)"></rect>
        </g>
    </g>
    
    <!-- Text below -->
    <text x="60" y="100" font-family="Arial Black" font-size="24" font-weight="900" fill="#8b4513" text-anchor="middle">GRIM</text>
    <text x="60" y="115" font-family="Arial" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="600">DATA REAPER</text>
    <text x="60" y="128" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">BACKUP SYSTEM</text>
</svg> 