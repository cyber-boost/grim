[package]
name = "grim-reaper"
version = "1.0.35"
edition = "2021"
authors = ["Bernie Gengel and his beagle Buddy <rip@grim.so>"]
description = "Death Defying Data Protection - When data death comes knocking, Grim ensures resurrection is just a command away"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cyber-boost/grim"
homepage = "https://grim.so"
keywords = ["backup", "monitoring", "security", "grim", "core-integration"]
categories = ["command-line-utilities", "filesystem", "compression"]
exclude = ["target/", "backups/", "deployments/", "*.tar.gz", "grimrust.sh"]

[dependencies]
# Essential dependencies for core integration
tokio = { version = "1.0", features = ["macros", "process", "fs", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

# HTTP client for py_grim API integration
reqwest = { version = "0.11", features = ["json"] }

# File system utilities
walkdir = "2.3"

# Configuration and utilities
dirs = "5.0"
which = "4.4"

# Date/time handling for installation records
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
assert_fs = "1.0"

[[bin]]
name = "grim"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Workspace configuration (uncomment when crates are ready)
