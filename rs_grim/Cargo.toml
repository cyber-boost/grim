[package]
name = "grim-reaper"
version = "0.1.0"
edition = "2021"
authors = ["Grim Reaper Team <grim@reaper.dev>"]
description = "Grim Reaper Rust SDK - High-performance backup and deployment system"
license = "MIT"
repository = "https://github.com/grim-reaper/rust-sdk"
keywords = ["backup", "deployment", "grim", "reaper", "sdk"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# File system and compression
walkdir = "2.3"
flate2 = "1.0"
tar = "0.4"
zip = "0.6"

# Network and HTTP
reqwest = { version = "0.11", features = ["json"] }
hyper = "0.14"
tower = "0.4"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite"] }

# Security and cryptography
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
base64 = "0.21"

# Configuration
config = "0.13"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
regex = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
assert_fs = "1.0"

[[bin]]
name = "grim"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

