apiVersion: apps/v1
kind: Deployment
metadata:
  name: grim-api
  namespace: production
  labels:
    app: grim-api
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: grim-api
  template:
    metadata:
      labels:
        app: grim-api
        version: v1.0.0
    spec:
      containers:
      - name: grim-api
        image: grim-reaper:latest
        ports:
        - containerPort: 8080
        env:
        - name: GRIM_ENV
          value: "production"
        - name: GRIM_LOG_LEVEL
          value: "info"
        - name: GRIM_DB_PATH
          value: "/data/grim.db"
        - name: GRIM_BACKUP_PATH
          value: "/backups"
        - name: GRIM_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: grim-secrets
              key: encryption-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: grim-data
          mountPath: /data
        - name: grim-backups
          mountPath: /backups
        - name: grim-logs
          mountPath: /var/log/grim
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: grim-data
        persistentVolumeClaim:
          claimName: grim-data-pvc
      - name: grim-backups
        persistentVolumeClaim:
          claimName: grim-backups-pvc
      - name: grim-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grim-api-service
  namespace: production
spec:
  selector:
    app: grim-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grim-data-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grim-backups-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: Secret
metadata:
  name: grim-secrets
  namespace: production
type: Opaque
data:
  encryption-key: <base64-encoded-key>
  postgres-password: <base64-encoded-password>
  redis-password: <base64-encoded-password> 