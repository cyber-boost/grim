# Grim Auto Backup Configuration
GRAVEYARD_DIR = "/root/.graveyard"
MONITOR_DIR = "."
BACKUP_INTERVAL = 300
MAX_BACKUPS = 50
MIN_FILE_SIZE = 1024
EXCLUDE_PATTERNS = ["*.tmp", "*.log", "*.cache", ".git/*", "node_modules/*", "venv/*"]
INCLUDE_PATTERNS = ["*.py", "*.sh", "*.go", "*.js", "*.php", "*.ts", "*.tsk", "*.pnt"]
COMPRESSION_ALGORITHM = "zstd"
