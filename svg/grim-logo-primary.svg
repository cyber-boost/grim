<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Enhanced scythe handle with gradient -->
    <defs>
        <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#654321"></stop>
            <stop offset="100%" style="stop-color:#8b4513"></stop>
        </linearGradient>
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#b8860b"></stop>
            <stop offset="100%" style="stop-color:#8b4513"></stop>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"></feGaussianBlur>
            <feMerge> 
                <feMergeNode in="coloredBlur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Scythe handle -->
    <line x1="30" y1="65" x2="50" y2="15" stroke="url(#handleGrad)" stroke-width="4" stroke-linecap="round"></line>
    
    <!-- Scythe blade with more detail -->
    <path d="M50 15 C62 8, 80 12, 88 25 C85 32, 75 35, 65 32 C58 28, 52 20, 50 15" fill="url(#bladeGrad)" stroke="#654321" stroke-width="1"></path>
    
    <!-- Sharp edge highlight -->
    <path d="M52 18 C64 11, 78 14, 85 26" fill="none" stroke="#daa520" stroke-width="1" opacity="0.8"></path>
    
    <!-- Data streams being cut - more detailed -->
    <g>
        <!-- Intact data streams -->
        <rect x="65" y="32" width="30" height="3" fill="#b8860b" rx="1"></rect>
        <rect x="62" y="38" width="25" height="3" fill="#daa520" rx="1"></rect>
        <rect x="67" y="44" width="22" height="3" fill="#b8860b" rx="1"></rect>
        <rect x="64" y="50" width="28" height="3" fill="#cd853f" rx="1"></rect>
        
        <!-- Cut/scattered pieces -->
        <g opacity="0.6">
            <rect x="96" y="32" width="8" height="3" fill="#b8860b" rx="1" transform="rotate(15 100 33.5)"></rect>
            <rect x="102" y="34" width="5" height="3" fill="#b8860b" rx="1" transform="rotate(-10 104.5 35.5)"></rect>
            
            <rect x="88" y="38" width="6" height="3" fill="#daa520" rx="1" transform="rotate(20 91 39.5)"></rect>
            <rect x="96" y="40" width="4" height="3" fill="#daa520" rx="1" transform="rotate(-25 98 41.5)"></rect>
            
            <rect x="90" y="44" width="7" height="3" fill="#b8860b" rx="1" transform="rotate(12 93.5 45.5)"></rect>
            <rect x="99" y="46" width="4" height="3" fill="#b8860b" rx="1" transform="rotate(-18 101 47.5)"></rect>
        </g>
        
        <!-- Cutting effect particles -->
        <g opacity="0.8">
            <circle cx="88" cy="33" r="1" fill="#daa520"></circle>
            <circle cx="92" cy="39" r="0.8" fill="#b8860b"></circle>
            <circle cx="89" cy="45" r="1.2" fill="#cd853f"></circle>
        </g>
    </g>
    
    <!-- GRIM text with better typography -->
    <text x="120" y="35" font-family="Arial Black" font-size="28" font-weight="900" fill="#8b4513" filter="url(#glow)">GRIM</text>
    <text x="120" y="52" font-family="Arial" font-size="12" fill="#b8860b" font-weight="600">DATA REAPER</text>
    <text x="120" y="65" font-family="monospace" font-size="9" fill="#666">BACKUP • PROTECT • SURVIVE</text>
</svg> 