<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop offset="0%" style="stop-color:#daa520;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#b8860b;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circles -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.1"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="150" r="100" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.3"/>
  
  <!-- Rotating outer ring -->
  <g transform="translate(150, 150)">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#lockGradient)" stroke-width="2" stroke-dasharray="5,10" opacity="0.5"/>
  </g>
  
  <!-- Counter-rotating inner ring -->
  <g transform="translate(150, 150)">
    <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="20s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#lockGradient)" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
  </g>
  
  <!-- Main lock body -->
  <g transform="translate(150, 150)">
    <!-- Lock shackle -->
    <path d="M -30 -10 L -30 -25 Q -30 -50 0 -50 Q 30 -50 30 -25 L 30 -10" 
          fill="none" 
          stroke="url(#lockGradient)" 
          stroke-width="6" 
          stroke-linecap="round"
          filter="url(#glow)">
      <!-- Shackle unlock animation -->
      <animate attributeName="d" 
               values="M -30 -10 L -30 -25 Q -30 -50 0 -50 Q 30 -50 30 -25 L 30 -10;
                       M -30 -10 L -30 -35 Q -30 -60 0 -60 Q 30 -60 30 -35 L 30 -25;
                       M -30 -10 L -30 -25 Q -30 -50 0 -50 Q 30 -50 30 -25 L 30 -10" 
               dur="4s" 
               begin="0s;click"
               repeatCount="1"/>
    </path>
    
    <!-- Lock body -->
    <rect x="-40" y="-10" width="80" height="60" rx="10" 
          fill="#1a1a1a" 
          stroke="url(#lockGradient)" 
          stroke-width="3"
          filter="url(#glow)"/>
    
    <!-- Inner lock mechanism -->
    <rect x="-35" y="-5" width="70" height="50" rx="8" 
          fill="#0a0a0a" 
          stroke="#654321" 
          stroke-width="1"
          opacity="0.8"/>
    
    <!-- Keyhole -->
    <g transform="translate(0, 15)">
      <!-- Keyhole shape -->
      <circle cx="0" cy="-5" r="8" fill="#2a2a2a"/>
      <rect x="-4" y="-5" width="8" height="15" fill="#2a2a2a"/>
      
      <!-- Glowing center -->
      <circle cx="0" cy="-5" r="6" fill="url(#centerGlow)">
        <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Security indicators -->
    <g opacity="0.8">
      <!-- Left indicator -->
      <circle cx="-20" cy="15" r="3" fill="#dc3545">
        <animate attributeName="fill" values="#dc3545;#28a745;#dc3545" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Right indicator -->
      <circle cx="20" cy="15" r="3" fill="#dc3545">
        <animate attributeName="fill" values="#dc3545;#28a745;#dc3545" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Floating security symbols -->
  <g font-family="Arial" font-size="14" fill="#8b4513" opacity="0.3">
    <text x="50" y="50">
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
      🔐
    </text>
    <text x="230" y="70">
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      🔑
    </text>
    <text x="60" y="250">
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      🛡️
    </text>
    <text x="220" y="240">
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="3s" repeatCount="indefinite"/>
      🔒
    </text>
  </g>
  
  <!-- Data streams -->
  <g stroke="#b8860b" stroke-width="1" fill="none" opacity="0.2">
    <path d="M 50 150 Q 100 100 150 150 T 250 150">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;0,100" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 180 Q 100 230 150 180 T 250 180">
      <animate attributeName="stroke-dasharray" values="0,100;50,50;0,100" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Authentication text -->
  <text x="150" y="270" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#e6e6e6">SECURE AUTHENTICATION</text>
  
  <!-- Scanning beam effect -->
  <rect x="0" y="0" width="300" height="4" fill="url(#lockGradient)" opacity="0.3">
    <animate attributeName="y" values="0;300;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>