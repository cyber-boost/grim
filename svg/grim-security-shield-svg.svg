<svg width="300" height="350" viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color:#b8860b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0" />
    </radialGradient>
    <filter id="shieldGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background hexagon pattern -->
  <pattern id="hexPattern" x="0" y="0" width="30" height="26" patternUnits="userSpaceOnUse">
    <polygon points="15,1 27,7 27,19 15,25 3,19 3,7" fill="none" stroke="#8b4513" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="300" height="350" fill="#0a0a0a"/>
  <rect width="300" height="350" fill="url(#hexPattern)"/>
  
  <!-- Shield base -->
  <g transform="translate(150, 150)">
    <!-- Outer shield glow -->
    <path d="M 0 -80 L -70 -40 L -70 40 Q -70 100 0 120 Q 70 100 70 40 L 70 -40 Z" 
          fill="none" stroke="url(#shieldGradient)" stroke-width="3" opacity="0.3" filter="url(#shieldGlow)">
      <animate attributeName="stroke-width" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Main shield -->
    <path d="M 0 -80 L -70 -40 L -70 40 Q -70 100 0 120 Q 70 100 70 40 L 70 -40 Z" 
          fill="#1a1a1a" stroke="url(#shieldGradient)" stroke-width="2"/>
    
    <!-- Inner shield design -->
    <path d="M 0 -60 L -50 -30 L -50 30 Q -50 70 0 90 Q 50 70 50 30 L 50 -30 Z" 
          fill="none" stroke="#654321" stroke-width="1" opacity="0.5"/>
    
    <!-- Lock icon -->
    <g transform="translate(0, -10)">
      <rect x="-20" y="0" width="40" height="30" rx="5" fill="#2a2a2a" stroke="#b8860b" stroke-width="2"/>
      <path d="M -15 0 L -15 -10 Q -15 -20 0 -20 Q 15 -20 15 -10 L 15 0" 
            fill="none" stroke="#b8860b" stroke-width="3"/>
      <circle cx="0" cy="15" r="5" fill="#b8860b"/>
      <!-- Lock pulse -->
      <circle cx="0" cy="15" r="5" fill="none" stroke="#b8860b" stroke-width="2">
        <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Security layers -->
    <g opacity="0.6">
      <!-- Layer 1 -->
      <circle cx="0" cy="0" r="90" fill="none" stroke="#28a745" stroke-width="1" stroke-dasharray="5,5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <!-- Layer 2 -->
      <circle cx="0" cy="0" r="100" fill="none" stroke="#ffc107" stroke-width="1" stroke-dasharray="10,5">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="25s" repeatCount="indefinite"/>
      </circle>
      <!-- Layer 3 -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#dc3545" stroke-width="1" stroke-dasharray="3,7">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Threat indicators -->
    <g font-family="monospace" font-size="8" fill="#e6e6e6">
      <!-- Detected threats -->
      <g transform="translate(-100, -100)">
        <circle cx="0" cy="0" r="15" fill="#dc3545" opacity="0.2"/>
        <text x="0" y="3" text-anchor="middle">BLOCKED</text>
        <line x1="15" y1="0" x2="50" y2="30" stroke="#dc3545" stroke-width="1" opacity="0.5"/>
      </g>
      
      <!-- Scanning -->
      <g transform="translate(100, -80)">
        <circle cx="0" cy="0" r="15" fill="#ffc107" opacity="0.2"/>
        <text x="0" y="3" text-anchor="middle">SCANNING</text>
        <line x1="-15" y1="0" x2="-50" y2="20" stroke="#ffc107" stroke-width="1" opacity="0.5"/>
      </g>
      
      <!-- Protected -->
      <g transform="translate(0, 100)">
        <circle cx="0" cy="0" r="15" fill="#28a745" opacity="0.2"/>
        <text x="0" y="3" text-anchor="middle">SECURED</text>
      </g>
    </g>
    
    <!-- Status text -->
    <text x="0" y="160" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#e6e6e6">Security Score: 94%</text>
    
    <!-- Scanning beam -->
    <g transform="translate(0, 0)" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      <path d="M 0 0 L 0 -120 L 20 -140 Z" fill="url(#glowGradient)" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Floating security icons -->
  <g font-size="20" opacity="0.4">
    <text x="30" y="50">🔒</text>
    <text x="250" y="80">🛡️</text>
    <text x="40" y="300">🔐</text>
    <text x="240" y="320">🔑</text>
  </g>
  
  <!-- Title -->
  <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#e6e6e6">GRIM Security Shield</text>
</svg>