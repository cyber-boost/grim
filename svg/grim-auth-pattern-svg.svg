<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="patternGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#b8860b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="hexGrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,1 45,13 45,39 30,51 15,39 15,13" 
               fill="none" 
               stroke="url(#patternGradient)" 
               stroke-width="1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  
  <!-- Hexagon grid -->
  <rect width="400" height="400" fill="url(#hexGrid)" opacity="0.5"/>
  
  <!-- Central focal point -->
  <g transform="translate(200, 200)">
    <!-- Ripple effect circles -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#b8860b" stroke-width="1" opacity="0">
      <animate attributeName="r" values="50;150;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#8b4513" stroke-width="1" opacity="0">
      <animate attributeName="r" values="50;150;50" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#daa520" stroke-width="1" opacity="0">
      <animate attributeName="r" values="50;150;50" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Central skull motif -->
    <g opacity="0.3" filter="url(#blur)">
      <path d="M -20 -15 Q -25 -30 0 -35 Q 25 -30 20 -15 L 20 0 Q 20 15 10 20 L 5 25 L 0 30 L -5 25 L -10 20 Q -20 15 -20 0 Z" 
            fill="url(#patternGradient)"/>
      <ellipse cx="-8" cy="-8" rx="5" ry="7" fill="#0a0a0a"/>
      <ellipse cx="8" cy="-8" rx="5" ry="7" fill="#0a0a0a"/>
      <path d="M -2 0 L 0 3 L 2 0" fill="#0a0a0a"/>
    </g>
  </g>
  
  <!-- Corner decorations -->
  <g opacity="0.4">
    <!-- Top left -->
    <path d="M 0 0 L 100 0 L 100 20 L 20 20 L 20 100 L 0 100 Z" 
          fill="url(#patternGradient)"/>
    
    <!-- Top right -->
    <path d="M 400 0 L 300 0 L 300 20 L 380 20 L 380 100 L 400 100 Z" 
          fill="url(#patternGradient)"/>
    
    <!-- Bottom left -->
    <path d="M 0 400 L 100 400 L 100 380 L 20 380 L 20 300 L 0 300 Z" 
          fill="url(#patternGradient)"/>
    
    <!-- Bottom right -->
    <path d="M 400 400 L 300 400 L 300 380 L 380 380 L 380 300 L 400 300 Z" 
          fill="url(#patternGradient)"/>
  </g>
  
  <!-- Floating orbs -->
  <g opacity="0.6">
    <circle cx="80" cy="80" r="3" fill="#b8860b">
      <animate attributeName="cy" values="80;320;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="320" r="3" fill="#8b4513">
      <animate attributeName="cy" values="320;80;320" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="50" r="2" fill="#daa520">
      <animate attributeName="cx" values="150;250;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="350" r="2" fill="#b8860b">
      <animate attributeName="cx" values="250;150;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Data flow lines -->
  <g stroke="#8b4513" stroke-width="1" fill="none" opacity="0.2">
    <path d="M 0 100 Q 200 150 400 100">
      <animate attributeName="stroke-dasharray" values="0,400;200,200;0,400" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 300 Q 200 250 400 300">
      <animate attributeName="stroke-dasharray" values="0,400;200,200;0,400" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Authentication symbols -->
  <g font-family="Arial" font-size="20" fill="#8b4513" opacity="0.2">
    <text x="100" y="200" transform="rotate(45 100 200)">⚡</text>
    <text x="300" y="200" transform="rotate(-45 300 200)">🔐</text>
    <text x="200" y="100" transform="rotate(90 200 100)">💀</text>
    <text x="200" y="300" transform="rotate(-90 200 300)">🛡️</text>
  </g>
  
  <!-- Glitch effect lines -->
  <g opacity="0.1">
    <rect x="0" y="150" width="400" height="2" fill="#dc3545">
      <animate attributeName="y" values="150;250;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="250" width="400" height="2" fill="#28a745">
      <animate attributeName="y" values="250;150;250" dur="7s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>