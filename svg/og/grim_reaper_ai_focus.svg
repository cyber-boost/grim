<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#654321"/>
      <stop offset="100%" style="stop-color:#8b4513"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="50%" style="stop-color:#00cc66"/>
      <stop offset="100%" style="stop-color:#008844"/>
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neural network pattern -->
    <pattern id="neuralPattern" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="transparent"/>
      <!-- Nodes -->
      <circle cx="10" cy="10" r="2" fill="#00ff88" opacity="0.6"/>
      <circle cx="50" cy="30" r="2" fill="#00cc66" opacity="0.6"/>
      <circle cx="30" cy="50" r="2" fill="#008844" opacity="0.6"/>
      <!-- Connections -->
      <line x1="10" y1="10" x2="50" y2="30" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
      <line x1="50" y1="30" x2="30" y2="50" stroke="#00cc66" stroke-width="1" opacity="0.3"/>
      <line x1="30" y1="50" x2="10" y2="10" stroke="#008844" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#neuralPattern)" opacity="0.2"/>
  
  <!-- AI Brain Visualization -->
  <g transform="translate(700, 150)">
    <!-- Central processing unit -->
    <circle cx="150" cy="150" r="80" fill="none" stroke="url(#aiGradient)" stroke-width="3" filter="url(#strongGlow)"/>
    <circle cx="150" cy="150" r="50" fill="url(#aiGradient)" opacity="0.2"/>
    
    <!-- Neural pathways -->
    <g opacity="0.8">
      <circle cx="80" cy="80" r="15" fill="#00ff88" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="80" r="15" fill="#00cc66" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="220" r="15" fill="#008844" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="220" r="15" fill="#00ff88" filter="url(#glow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Connecting lines -->
      <line x1="80" y1="80" x2="150" y2="150" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
      <line x1="220" y1="80" x2="150" y2="150" stroke="#00cc66" stroke-width="2" opacity="0.6"/>
      <line x1="80" y1="220" x2="150" y2="150" stroke="#008844" stroke-width="2" opacity="0.6"/>
      <line x1="220" y1="220" x2="150" y2="150" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- AI label -->
    <text x="150" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="700" 
          text-anchor="middle" fill="#00ff88">AI CORE</text>
  </g>
  
  <!-- Left side - Main messaging -->
  <g transform="translate(60, 80)">
    <!-- Scythe icon (smaller) -->
    <g transform="scale(1.2)">
      <line x1="25" y1="80" x2="45" y2="25" stroke="url(#heroGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M45 25 C60 15, 85 20, 95 38 C92 48, 78 52, 70 48 C62 43, 58 35, 45 25" 
            fill="url(#accentGradient)" stroke="#654321" stroke-width="2" filter="url(#glow)"/>
    </g>
    
    <!-- Main heading -->
    <text x="0" y="140" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
          fill="url(#accentGradient)" filter="url(#glow)">AI-POWERED</text>
    <text x="0" y="180" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" 
          fill="url(#accentGradient)" filter="url(#glow)">DATA PROTECTION</text>
    
    <!-- Subtitle -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="600" 
          fill="#daa520">Predictive Intelligence • Self-Healing Systems</text>
    
    <!-- AI features -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#00ff88">
        🧠 Predictive Failure Detection
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#00cc66">
        📊 Intelligent Resource Forecasting  
      </text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#008844">
        🔄 Auto-Optimization & Self-Healing
      </text>
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#00ff88">
        ⚡ 30% Faster Incident Resolution
      </text>
    </g>
  </g>
  
  <!-- Data streams and AI processing -->
  <g transform="translate(600, 400)">
    <!-- Data being processed -->
    <g opacity="0.9">
      <rect x="0" y="0" width="150" height="6" fill="#daa520" rx="3">
        <animate attributeName="width" values="0;150;150;0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="15" width="120" height="6" fill="#b8860b" rx="3">
        <animate attributeName="width" values="0;120;120;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="30" width="180" height="6" fill="#cd853f" rx="3">
        <animate attributeName="width" values="0;180;180;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- AI processing indicator -->
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="12" fill="#00ff88">
      AI PROCESSING...
    </text>
    
    <!-- Results -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#00ff88" stroke-width="2" rx="5"/>
      <text x="40" y="15" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00ff88">OPTIMIZED</text>
      <text x="40" y="30" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00ff88">& SECURE</text>
    </g>
  </g>
  
  <!-- Bottom CTA -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="320" height="50" fill="url(#aiGradient)" rx="25" filter="url(#strongGlow)"/>
    <text x="160" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" 
          text-anchor="middle" fill="#000000">Experience AI-Driven Protection</text>
  </g>
  
  <!-- Performance metrics -->
  <g transform="translate(900, 480)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00ff88">
      ML Models: Failure Prediction • Capacity Planning • Auto-Tuning
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#daa520">
      99.9% Accuracy • Real-time Learning • Zero Manual Tuning
    </text>
  </g>
  
  <!-- Brand mark -->
  <text x="1140" y="610" font-family="monospace" font-size="10" text-anchor="end" fill="#8b4513" opacity="0.7">
    AI v2.0 • grimreaper.ai
  </text>
</svg>