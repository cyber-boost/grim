<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#654321"/>
      <stop offset="100%" style="stop-color:#8b4513"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39d353"/>
      <stop offset="50%" style="stop-color:#28a745"/>
      <stop offset="100%" style="stop-color:#196127"/>
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Code pattern -->
    <pattern id="codePattern" patternUnits="userSpaceOnUse" width="100" height="60">
      <rect width="100" height="60" fill="transparent"/>
      <!-- Code brackets and symbols -->
      <text x="10" y="15" font-family="monospace" font-size="10" fill="#58a6ff" opacity="0.3">&lt;/&gt;</text>
      <text x="60" y="35" font-family="monospace" font-size="10" fill="#39d353" opacity="0.3">{}</text>
      <text x="30" y="50" font-family="monospace" font-size="10" fill="#1f6feb" opacity="0.3">[]</text>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#codePattern)" opacity="0.5"/>
  
  <!-- Code Terminal/IDE Mockup -->
  <g transform="translate(650, 100)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="400" height="250" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="8"/>
    <!-- Terminal header -->
    <rect x="0" y="0" width="400" height="30" fill="#21262d" rx="8"/>
    <circle cx="15" cy="15" r="4" fill="#ff5f56"/>
    <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
    <circle cx="45" cy="15" r="4" fill="#27ca3f"/>
    <text x="200" y="20" font-family="monospace" font-size="10" text-anchor="middle" fill="#7d8590">grim-cli</text>
    
    <!-- Code content -->
    <g transform="translate(15, 45)">
      <text x="0" y="15" font-family="monospace" font-size="12" fill="#7c3aed">$</text>
      <text x="15" y="15" font-family="monospace" font-size="12" fill="#58a6ff">grim backup create</text>
      <text x="140" y="15" font-family="monospace" font-size="12" fill="#f85149">--source</text>
      <text x="200" y="15" font-family="monospace" font-size="12" fill="#a5f3fc">/data</text>
      
      <text x="0" y="35" font-family="monospace" font-size="12" fill="#39d353">✓ Backup job created: backup-2025-001</text>
      
      <text x="0" y="55" font-family="monospace" font-size="12" fill="#7c3aed">$</text>
      <text x="15" y="55" font-family="monospace" font-size="12" fill="#58a6ff">grim monitor status</text>
      
      <text x="0" y="75" font-family="monospace" font-size="12" fill="#39d353">✓ All systems operational</text>
      <text x="0" y="90" font-family="monospace" font-size="12" fill="#39d353">✓ Last backup: 2 minutes ago</text>
      
      <text x="0" y="110" font-family="monospace" font-size="12" fill="#7c3aed">$</text>
      <text x="15" y="110" font-family="monospace" font-size="12" fill="#58a6ff">curl</text>
      <text x="50" y="110" font-family="monospace" font-size="12" fill="#f85149">-X POST</text>
      <text x="110" y="110" font-family="monospace" font-size="12" fill="#a5f3fc">api.grimreaper.ai/v1/backup</text>
      
      <text x="0" y="130" font-family="monospace" font-size="12" fill="#f85149">{</text>
      <text x="15" y="145" font-family="monospace" font-size="12" fill="#58a6ff">"status":</text>
      <text x="80" y="145" font-family="monospace" font-size="12" fill="#a5f3fc">"success"</text>
      <text x="0" y="160" font-family="monospace" font-size="12" fill="#f85149">}</text>
      
      <!-- Cursor -->
      <rect x="0" y="175" width="8" height="15" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- API documentation preview -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="400" height="120" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="8"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#58a6ff">API Documentation</text>
      
      <text x="15" y="40" font-family="monospace" font-size="10" fill="#39d353">POST /v1/backup</text>
      <text x="15" y="55" font-family="monospace" font-size="10" fill="#7d8590">Creates a new backup job</text>
      
      <text x="15" y="75" font-family="monospace" font-size="10" fill="#39d353">GET /v1/monitor/health</text>
      <text x="15" y="90" font-family="monospace" font-size="10" fill="#7d8590">Returns system health status</text>
      
      <text x="15" y="110" font-family="monospace" font-size="10" fill="#58a6ff">15+ endpoints • OpenAPI 3.0</text>
    </g>
  </g>
  
  <!-- Left side - Main messaging -->
  <g transform="translate(60, 80)">
    <!-- Developer scythe with code accent -->
    <g transform="scale(1.2)">
      <line x1="25" y1="80" x2="45" y2="25" stroke="url(#heroGradient)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M45 25 C60 15, 85 20, 95 38 C92 48, 78 52, 70 48 C62 43, 58 35, 45 25" 
            fill="url(#accentGradient)" stroke="#654321" stroke-width="2" filter="url(#glow)"/>
      <!-- Code brackets overlay -->
      <text x="70" y="20" font-family="monospace" font-size="12" fill="#39d353">&lt;/&gt;</text>
    </g>
    
    <!-- Main heading -->
    <text x="0" y="140" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" 
          fill="url(#accentGradient)" filter="url(#glow)">DEVELOPER-FIRST</text>
    <text x="0" y="180" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" 
          fill="url(#accentGradient)" filter="url(#glow)">PLATFORM</text>
    
    <!-- Subtitle -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="600" 
          fill="#39d353">APIs • SDKs • CLI • Automation • Integration Ready</text>
    
    <!-- Developer features -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">
        🚀 RESTful APIs • GraphQL • Webhooks
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#39d353">
        📦 SDKs: Python, JS, Go, PHP, Java, .NET
      </text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1f6feb">
        ⚡ CLI Tool • Docker Images • Terraform
      </text>
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#28a745">
        📚 Interactive Docs • Sandbox Environment
      </text>
    </g>
  </g>
  
  <!-- Integration examples -->
  <g transform="translate(580, 450)">
    <!-- Language logos/badges -->
    <g opacity="0.9">
      <!-- Python -->
      <rect x="0" y="0" width="60" height="25" fill="#3776ab" rx="12"/>
      <text x="30" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
            text-anchor="middle" fill="white">Python</text>
      
      <!-- JavaScript -->
      <rect x="70" y="0" width="60" height="25" fill="#f7df1e" rx="12"/>
      <text x="100" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
            text-anchor="middle" fill="black">Node.js</text>
      
      <!-- Go -->
      <rect x="140" y="0" width="60" height="25" fill="#00add8" rx="12"/>
      <text x="170" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
            text-anchor="middle" fill="white">Go</text>
      
      <!-- Docker -->
      <rect x="210" y="0" width="60" height="25" fill="#2496ed" rx="12"/>
      <text x="240" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="600" 
            text-anchor="middle" fill="white">Docker</text>
    </g>
    
    <!-- Quick start info -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#39d353">
      pip install grim-sdk • npm i @grimreaper/sdk • go get grim.dev/sdk
    </text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#58a6ff">
      5-minute integration • Zero-config Docker • Kubernetes Helm Charts
    </text>
  </g>
  
  <!-- Bottom CTA -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="340" height="50" fill="url(#devGradient)" rx="25" filter="url(#strongGlow)"/>
    <text x="170" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="700" 
          text-anchor="middle" fill="white">Start Building • Free API Keys</text>
  </g>
  
  <!-- Developer benefits -->
  <g transform="translate(850, 480)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#39d353">
      OpenAPI 3.0 • Postman Collections • Rate Limits: 10K/hour Free
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#58a6ff">
      GitHub Integration • CI/CD Templates • Community Discord
    </text>
  </g>
  
  <!-- Brand mark -->
  <text x="1140" y="610" font-family="monospace" font-size="10" text-anchor="end" fill="#8b4513" opacity="0.7">
    Dev v4.0 • grimreaper.ai
  </text>
</svg>