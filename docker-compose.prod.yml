version: '3.8'

services:
  # Grim Core Services
  grim-api:
    image: grim-reaper:latest
    container_name: grim-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GRIM_ENV=production
      - GRIM_LOG_LEVEL=info
      - GRIM_DB_PATH=/data/grim.db
      - GRIM_BACKUP_PATH=/backups
      - GRIM_ENCRYPTION_KEY=${GRIM_ENCRYPTION_KEY}
    volumes:
      - grim-data:/data
      - grim-backups:/backups
      - /var/log/grim:/var/log/grim
    networks:
      - grim-network
    depends_on:
      - grim-redis
      - grim-postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grim-worker:
    image: grim-reaper:latest
    container_name: grim-worker
    restart: unless-stopped
    command: ["grim", "worker", "--workers=4"]
    environment:
      - GRIM_ENV=production
      - GRIM_LOG_LEVEL=info
      - GRIM_DB_PATH=/data/grim.db
      - GRIM_BACKUP_PATH=/backups
      - GRIM_ENCRYPTION_KEY=${GRIM_ENCRYPTION_KEY}
    volumes:
      - grim-data:/data
      - grim-backups:/backups
      - /var/log/grim:/var/log/grim
    networks:
      - grim-network
    depends_on:
      - grim-redis
      - grim-postgres

  # Scythe License Management
  scythe-api:
    image: scythe-license:latest
    container_name: scythe-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SCYTHE_ENV=production
      - SCYTHE_LOG_LEVEL=info
      - SCYTHE_DB_PATH=/data/scythe.db
      - SCYTHE_LICENSE_KEY=${SCYTHE_LICENSE_KEY}
    volumes:
      - scythe-data:/data
      - /var/log/scythe:/var/log/scythe
    networks:
      - grim-network
    depends_on:
      - grim-postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database Services
  grim-postgres:
    image: postgres:15-alpine
    container_name: grim-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=grim
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - grim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d grim"]
      interval: 30s
      timeout: 10s
      retries: 3

  grim-redis:
    image: redis:7-alpine
    container_name: grim-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - grim-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: grim-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - grim-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grim-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - grim-network
    depends_on:
      - prometheus

  # Logging Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: grim-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - grim-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    container_name: grim-logstash
    restart: unless-stopped
    volumes:
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./config/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline
      - /var/log/grim:/var/log/grim:ro
      - /var/log/scythe:/var/log/scythe:ro
    networks:
      - grim-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: grim-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - grim-network
    depends_on:
      - elasticsearch

  # Error Tracking
  sentry:
    image: getsentry/sentry:latest
    container_name: grim-sentry
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SENTRY_SECRET_KEY=${SENTRY_SECRET_KEY}
      - SENTRY_POSTGRES_HOST=grim-postgres
      - SENTRY_POSTGRES_DB=sentry
      - SENTRY_REDIS_HOST=grim-redis
    volumes:
      - sentry-data:/var/lib/sentry
    networks:
      - grim-network
    depends_on:
      - grim-postgres
      - grim-redis

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: grim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/ssl:/etc/nginx/ssl
      - ./config/nginx/sites:/etc/nginx/sites-available
    networks:
      - grim-network
    depends_on:
      - grim-api
      - scythe-api

  # Backup Service
  backup-manager:
    image: grim-backup:latest
    container_name: grim-backup-manager
    restart: unless-stopped
    environment:
      - BACKUP_ENV=production
      - BACKUP_SCHEDULE=0 2 * * *
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
    volumes:
      - grim-data:/data:ro
      - grim-backups:/backups
      - /var/log/grim:/var/log/grim:ro
    networks:
      - grim-network

  # Security Monitoring
  security-monitor:
    image: grim-security:latest
    container_name: grim-security-monitor
    restart: unless-stopped
    environment:
      - SECURITY_ENV=production
      - SECURITY_LOG_LEVEL=info
      - SECURITY_ALERT_WEBHOOK=${SECURITY_ALERT_WEBHOOK}
    volumes:
      - /var/log/grim:/var/log/grim:ro
      - /var/log/scythe:/var/log/scythe:ro
    networks:
      - grim-network

volumes:
  grim-data:
    driver: local
  grim-backups:
    driver: local
  scythe-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  sentry-data:
    driver: local

networks:
  grim-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 